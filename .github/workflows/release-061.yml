name: Build 0.6.1 test release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-061.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.6.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test combat transport
        run: dotnet run --project tests/CombatTransport/CombatTransport.csproj -c Release
      - name: Build Steam bridge
        run: dotnet publish steam-bridge/RotMSteamBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=0.6.1 -o out/bridge
      - name: Package and verify
        run: python package/build-release-061.py
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.6.1 out/RotMCoop-Win64-0.6.1-test.zip out/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "RotMCoop 0.6.1" --notes-file package/RELEASE-0.6.1.md --prerelease --draft
          if ($LASTEXITCODE) { throw "Release upload failed" }
          gh release edit v0.6.1 --draft=false
          if ($LASTEXITCODE) { throw "Release publish failed" }
